# ======================================================
# 今日校园查寝签到工具 - 配置
# ======================================================
schoolName: 新疆师范大学

# 校区坐标（高德/百度地图获取）
campuses:
  昆仑校区:
    lon: '87.5927'
    lat: '43.8327'
  温泉校区:
    lon: '87.7056'
    lat: '43.8014'

# 默认校区
defaultCampus: 昆仑校区

# 加密密钥（Frida hook 从 9.9.20 版本提取）
# AES key 已通过 Frida hook SecretKeySpec 确认: AES/ECB/PKCS7Padding
# DES key: 9.9.20 版本 Frida 未在 Java 层检测到 DES 操作，暂保留旧 key
#   若签到返回"版本过低"，说明 DES key 也已更换，需进一步 hook native 层
desKey: 'XCE927=='
aesKey: 'abcdfe0987612345'

# Cookie持久化文件路径
cookieFile: '.session_cookies.json'
